<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" fill="none">
  <defs>
    <linearGradient id="asts-bl-bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="asts-bl-mark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="asts-bl-accent" x1="14" y1="44" x2="50" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="asts-bl-curve" x1="740" y1="210" x2="1130" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="asts-bl-area" x1="935" y1="58" x2="935" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.00"/>
    </linearGradient>
  </defs>

  <!-- Card Surface -->
  <rect width="1200" height="280" rx="16" fill="url(#asts-bl-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="15.5" stroke="#CBD5E1"/>

  <!-- Left: Brand Mark (64x64) -->
  <g transform="translate(48, 46)">
    <rect width="64" height="64" rx="14" fill="url(#asts-bl-mark)"/>
    <rect x="1" y="1" width="62" height="62" rx="13" stroke="#93C5FD" stroke-opacity="0.28" stroke-width="1"/>
    <path d="M14 22H50M14 32H50M14 42H50" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
    <circle cx="22" cy="22" r="6.5" stroke="#93C5FD" stroke-width="2" stroke-dasharray="3 2.2"/>
    <circle cx="22" cy="22" r="2.2" fill="#E0F2FE"/>
    <path d="M14 44L23 37L31 40L40 26L50 18" stroke="url(#asts-bl-accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 48L24 45L34 42L43 34L50 30" stroke="#93C5FD" stroke-opacity="0.65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="18" r="3" fill="#34D399"/>
    <circle cx="50" cy="30" r="2" fill="#93C5FD"/>
  </g>

  <!-- Left: Title & Tagline -->
  <text x="130" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="800" fill="#0F172A" letter-spacing="-0.02em">Automated Stock Trading Systems</text>
  <text x="130" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#2563EB" letter-spacing="0.06em">ASTS · BENSDORP MULTI-SYSTEM BACKTESTER</text>

  <text x="48" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#334155">Seven non-correlated trading systems in one offline Python backtester.</text>

  <!-- Left: Tech Pills -->
  <g transform="translate(48, 184)">
    <rect width="114" height="30" rx="15" fill="#DBEAFE" stroke="#93C5FD"/>
    <text x="57" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1E40AF">Python 3.10+</text>

    <rect x="124" width="128" height="30" rx="15" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="188" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#065F46">7 Uncorrelated</text>

    <rect x="262" width="136" height="30" rx="15" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="330" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155">Synthetic &amp; Real</text>
  </g>

  <!-- Right: Domain Artwork (Multi-System Equity Curves) -->
  <g>
    <rect x="724" y="28" width="428" height="224" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <!-- Gridlines -->
    <path d="M748 76H1128M748 122H1128M748 168H1128M748 214H1128" stroke="#F1F5F9" stroke-width="1"/>
    <path d="M824 52V226M900 52V226M976 52V226M1052 52V226" stroke="#F1F5F9" stroke-width="1"/>
    <!-- Indexed 100 baseline -->
    <line x1="748" y1="192" x2="1128" y2="192" stroke="#94A3B8" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="4 4"/>

    <!-- Individual system curves (subtle) -->
    <path d="M748 192 C795 190 835 174 880 176 C925 178 965 152 1015 148 C1060 144 1095 122 1128 116" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M748 192 C790 198 830 202 875 186 C920 170 960 174 1010 158 C1060 142 1095 148 1128 134" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M748 192 C795 184 840 164 890 168 C940 172 980 132 1030 128 C1075 124 1100 102 1128 96" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M748 192 C800 195 845 188 895 194 C945 200 985 182 1035 176 C1080 170 1102 162 1128 158" stroke="#A7F3D0" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Primary Suite7 area & curve -->
    <path d="M748 192 C795 178 835 156 882 152 C930 148 968 114 1018 102 C1062 92 1096 68 1128 58 L1128 226 L748 226 Z" fill="url(#asts-bl-area)"/>
    <path d="M748 192 C795 178 835 156 882 152 C930 148 968 114 1018 102 C1062 92 1096 68 1128 58" stroke="url(#asts-bl-curve)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Terminal highlight -->
    <circle cx="1128" cy="58" r="6" fill="#10B981" fill-opacity="0.22"/>
    <circle cx="1128" cy="58" r="3.5" fill="#10B981"/>
    <circle cx="1128" cy="96" r="2.5" fill="#38BDF8"/>
    <circle cx="1128" cy="116" r="2.5" fill="#60A5FA"/>
  </g>
</svg>
