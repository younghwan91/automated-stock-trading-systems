[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# 배포 이름은 asts-bensdorp — PyPI 의 `asts` 는 GrammaTech 의 tree-sitter 패키지가
# 이미 점유하고 있다. import 이름은 `asts` 그대로다(src/asts, CLI `asts`).
name = "asts-bensdorp"
version = "0.1.0"
description = "Automated Stock Trading Systems — a research-grade backtesting engine implementing the seven non-correlated systems from Laurens Bensdorp's book."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ASTS Contributors" }]
keywords = ["trading", "backtesting", "quant", "mean-reversion", "trend-following"]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=7.0", "pytest-cov", "ruff==0.16.2"]
plot = ["matplotlib>=3.6"]

[project.scripts]
asts = "asts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 룰셋을 명시한다 — ruff 기본 선택은 릴리스마다 넓어지므로, 그대로 두면 코드를 건드리지
# 않아도 CI가 갑자기 빨개진다(0.16에서 실제 발생). dev extra의 ruff 핀과 한 쌍이다.
select = ["E4", "E7", "E9", "F"]
